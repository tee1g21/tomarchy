# Custom system menu
#unbind = SUPER, ESCAPE
#bindd = SUPER, ESCAPE, System Menu (custom), exec, ~/.local/bin/omarchy-menu-custom system

# Light/Dark theme toggle
bindd = SUPER ALT, T, Theme Toggle, exec, ~/.local/bin/omarchy-theme-toggle

# Brightness 
unbind = ,XF86MonBrightnessUp
unbind = ,XF86MonBrightnessDown
bindd = ,XF86MonBrightnessUp, Brightness up, exec, ~/.local/bin/brightness-control up
bindd = ,XF86MonBrightnessDown, Brightness up, exec, ~/.local/bin/brightness-control down


### DUAL MONITOR WORKSPACES

# Unbind standard switch (SUPER + 1-0)
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19

# Unbind window move (SUPER + SHIFT + 1-0)
unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19

# Unbind silent window move (SUPER + SHIFT + ALT + 1-0)
unbind = SUPER SHIFT ALT, code:10
unbind = SUPER SHIFT ALT, code:11
unbind = SUPER SHIFT ALT, code:12
unbind = SUPER SHIFT ALT, code:13
unbind = SUPER SHIFT ALT, code:14
unbind = SUPER SHIFT ALT, code:15
unbind = SUPER SHIFT ALT, code:16
unbind = SUPER SHIFT ALT, code:17
unbind = SUPER SHIFT ALT, code:18
unbind = SUPER SHIFT ALT, code:19

# Unbind Omarchy's native workspace-moving commands
unbind = SUPER SHIFT ALT, LEFT
unbind = SUPER SHIFT ALT, RIGHT
unbind = SUPER SHIFT ALT, UP
unbind = SUPER SHIFT ALT, DOWN

# Switch current monitor
bindd = SUPER, code:10, Switch to workspace 1, exec, ~/.local/bin/spanned-workspaces switch 1
bindd = SUPER, code:11, Switch to workspace 2, exec, ~/.local/bin/spanned-workspaces switch 2
bindd = SUPER, code:12, Switch to workspace 3, exec, ~/.local/bin/spanned-workspaces switch 3
bindd = SUPER, code:13, Switch to workspace 4, exec, ~/.local/bin/spanned-workspaces switch 4
bindd = SUPER, code:14, Switch to workspace 5, exec, ~/.local/bin/spanned-workspaces switch 5

# Move window to workspace
bindd = SUPER SHIFT, code:10, Move window to workspace 1, exec, ~/.local/bin/spanned-workspaces move 1
bindd = SUPER SHIFT, code:11, Move window to workspace 2, exec, ~/.local/bin/spanned-workspaces move 2
bindd = SUPER SHIFT, code:12, Move window to workspace 3, exec, ~/.local/bin/spanned-workspaces move 3
bindd = SUPER SHIFT, code:13, Move window to workspace 4, exec, ~/.local/bin/spanned-workspaces move 4
bindd = SUPER SHIFT, code:14, Move window to workspace 5, exec, ~/.local/bin/spanned-workspaces move 5

# Move window silently to workspace
bindd = SUPER SHIFT ALT, code:10, Move window silently to workspace 1, exec, ~/.local/bin/spanned-workspaces movesilent 1
bindd = SUPER SHIFT ALT, code:11, Move window silently to workspace 2, exec, ~/.local/bin/spanned-workspaces movesilent 2
bindd = SUPER SHIFT ALT, code:12, Move window silently to workspace 3, exec, ~/.local/bin/spanned-workspaces movesilent 3
bindd = SUPER SHIFT ALT, code:13, Move window silently to workspace 4, exec, ~/.local/bin/spanned-workspaces movesilent 4
bindd = SUPER SHIFT ALT, code:14, Move window silently to workspace 5, exec, ~/.local/bin/spanned-workspaces movesilent 5

# Push ALL windows to adjacent monitor
bindd = SUPER SHIFT ALT, LEFT, Push all windows left, exec, ~/.local/bin/spanned-workspaces push-all l
bindd = SUPER SHIFT ALT, RIGHT, Push all windows right, exec, ~/.local/bin/spanned-workspaces push-all r
bindd = SUPER SHIFT ALT, UP, Push all windows up, exec, ~/.local/bin/spanned-workspaces push-all u
bindd = SUPER SHIFT ALT, DOWN, Push all windows down, exec, ~/.local/bin/spanned-workspaces push-all d

# Push active window to adjacent monitor
bindd = SUPER SHIFT CTRL, LEFT, Push active window left, exec, ~/.local/bin/spanned-workspaces push-active l
bindd = SUPER SHIFT CTRL, RIGHT, Push active window right, exec, ~/.local/bin/spanned-workspaces push-active r
bindd = SUPER SHIFT CTRL, UP, Push active window up, exec, ~/.local/bin/spanned-workspaces push-active u
bindd = SUPER SHIFT CTRL, DOWN, Push active window down, exec, ~/.local/bin/spanned-workspaces push-active d